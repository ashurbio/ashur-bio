    <!-- QA fixes applied to the build output; port them to the source CSS before the next build. -->
    <style id="qa-fixes">
      /* WCAG 2.2 SC 2.4.11: keep keyboard focus clear of the sticky top bar and fixed bottom nav */
      @media (max-width: 899px) {
        html {
          scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px));
          scroll-padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
        }
      }
      /* No double-tap zoom when tapping +/- quickly; no scroll chaining out of bottom sheets */
      button, a, input, select, textarea, label, [role=button] { touch-action: manipulation; }
      .sheet { overscroll-behavior: contain; }
      /* Absence counter "2 / 6" was reordered to "6 / 2" by the RTL bidi algorithm */
      .stepper output { direction: ltr; unicode-bidi: isolate; }
      /* Bigger tap area for text links (19px tall) without moving the layout */
      .link { padding-block: 8px; margin-block: -8px; }
      .auth-links .link { padding-block: 0; margin-block: 0; }
      /* Legible text: nothing under 12px (Lighthouse "legible font sizes") */
      .bi-en { font-size: max(.74em, 12px); }
      .bi.inline .bi-en { font-size: max(.8em, 12px); }
      h1 .bi-en { font-size: max(.46em, 12px); }
      h2 .bi-en, h3 .bi-en { font-size: max(.7em, 12px); }
      .sheet-head h2 .bi-en { font-size: max(.62em, 12px); }
      .uni .bi-en { font-size: max(.6em, 12px); }
      .mat .m .chip .bi-en, .lec .title .chip .bi-en { font-size: max(.82em, 12px); }
      .empty strong .bi-en { font-size: max(.78em, 12px); }
      .stat .bi-en, .bottom-nav .bi-en, .dept .bi-en, .tab .bi-en, .more-item .bi-en,
      .exam-feature .m .bi-en, .ecard dd .bi-en, .ecard dt .bi-en, .kv dt .bi-en, .kv dd .bi-en,
      .hint .bi-en, .note .bi-en, .count b .bi-en,
      .role, .bottom-nav button, .bottom-nav .bi-ar, .today-tag, .tick i { font-size: 12px; }
    </style>
